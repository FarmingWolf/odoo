<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Main calendar body with rounded corners -->
  <path d="M25,20 h50 a5,5 0 0 1 5,5 v50 a5,5 0 0 1 -5,5 h-50 a5,5 0 0 1 -5,-5 v-50 a5,5 0 0 1 5,-5 z"
        fill="#ffffff"
        stroke="#ffffff"
        stroke-opacity="0.3"
        fill-opacity="0"
        stroke-width="3"/>

  <!-- Top header line (perfectly centered) -->
  <path d="M20,30 h60"
        fill="#ffffff"
        stroke="#ffffff"
        stroke-opacity="0.3"
        stroke-width="2"/>

  <!-- Symmetrical binding marks -->
  <!-- Left ear (exactly 15px from left edge) -->
  <path d="M40,18 v10 a2,2 0 0 1 -2,2 h-6 a2,2 0 0 1 -2,-2 v-10"
        fill="#cca4e3"
        stroke="#ffffff"
        stroke-opacity="0.3"
        fill-opacity="0.3"
        stroke-width="2"/>

  <!-- Right ear (exactly 15px from right edge) -->
  <path d="M70,18 v10 a2,2 0 0 1 -2,2 h-6 a2,2 0 0 1 -2,-2 v-10"
        fill="#cca4e3"
        stroke="#ffffff"
        stroke-opacity="0.3"
        fill-opacity="0.3"
        stroke-width="2"/>

  <!-- Perfectly centered "周" character -->
  <text x="50" y="60"
        font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif"
        font-size="32"
        fill="#cca4e3"
        text-anchor="middle"
        fill-opacity="0.7"
        dominant-baseline="middle">月</text>
</svg>
